[package]
name = "cooperators"
version = "0.1.0"
edition = "2021"
description = "Localhost inter-agent communication broker"
license = "MIT OR Apache-2.0"

[[bin]]
name = "coop"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["full"] }
rmcp = { version = "=3.2.0", default-features = false, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
bytes = "=1.12.1"
http = "=1.5.0"
http-body = "=1.0.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
tower-service = "=0.3.3"
