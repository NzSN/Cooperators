[package]
name = "cooperators"
version = "0.1.0"
edition = "2021"
description = "Localhost inter-agent communication broker"
license = "MIT OR Apache-2.0"

[[bin]]
name = "coop"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["full"] }
